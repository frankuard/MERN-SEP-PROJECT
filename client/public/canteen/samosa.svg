<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Samosa">
  <defs>
    <linearGradient id="samosaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="samosaCrust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#samosaBg)"/>
  <ellipse cx="200" cy="220" rx="140" ry="35" fill="#451a03" opacity="0.4"/>
  <!-- Samosa 1 (Left) -->
  <polygon points="110,210 180,90 230,210" fill="url(#samosaCrust)" stroke="#b45309" stroke-width="4"/>
  <polygon points="110,210 180,90 145,210" fill="#f59e0b" opacity="0.6"/>
  <!-- Samosa 2 (Right) -->
  <polygon points="200,210 270,105 320,210" fill="url(#samosaCrust)" stroke="#b45309" stroke-width="4"/>
  <polygon points="200,210 270,105 235,210" fill="#f59e0b" opacity="0.6"/>
  <!-- Mint Chutney Bowl -->
  <circle cx="80" cy="180" r="30" fill="#047857"/>
  <circle cx="80" cy="180" r="24" fill="#10b981"/>
</svg>
